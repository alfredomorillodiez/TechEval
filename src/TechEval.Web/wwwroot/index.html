<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechEval Platform</title>
    <base href="/" />

    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Estilos de la aplicación -->
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <!-- Contenedor principal de Blazor -->
    <div id="app">
        <div class="d-flex flex-column justify-content-center align-items-center vh-100 bg-light gap-3">
            <div class="spinner-border text-primary" style="width:3rem;height:3rem;" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="text-muted small">Iniciando TechEval...</p>
        </div>
    </div>

    <!-- Error global de Blazor (oculto por defecto) -->
    <div id="blazor-error-ui">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        Se ha producido un error inesperado.
        <a href="" class="reload">Recargar página</a>
        <span class="dismiss">&#10005;</span>
    </div>

    <!-- Bootstrap JS -->
    <!-- El `integrity` anterior estaba corrompido y el navegador bloqueaba el paquete en
         cada carga, así que la aplicación corría sin el JavaScript de Bootstrap. No era un
         cambio del CDN: el resumen declarado y el real compartían los 22 primeros
         caracteres, y dos contenidos distintos difieren desde el primero. El CSS, con su
         propio `integrity`, sí cargaba. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

    <!-- Blazor WebAssembly runtime -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
