version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SA_PASSWORD:?define SA_PASSWORD en tu .env — ver .env.example}"
      ACCEPT_EULA: "Y"
      # Developer no tiene licencia para producción. Se elige en .env, no aquí: ver .env.example.
      MSSQL_PID: "${MSSQL_PID:?define MSSQL_PID en tu .env — ver .env.example}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TechEvalDb;User Id=sa;Password=${SA_PASSWORD:?define SA_PASSWORD en tu .env};TrustServerCertificate=True;
      - Jwt__SecretKey=${JWT_SECRET_KEY:?define JWT_SECRET_KEY en tu .env — ver .env.example}
      - Email__FromEmail=${EMAIL_FROM:?define EMAIL_FROM en tu .env}
      - Email__Office365__TenantId=${O365_TENANT_ID:?define O365_TENANT_ID en tu .env}
      - Email__Office365__ClientId=${O365_CLIENT_ID:?define O365_CLIENT_ID en tu .env}
      - Email__Office365__ClientSecret=${O365_CLIENT_SECRET:?define O365_CLIENT_SECRET en tu .env}
      - AdminPassword=${ADMIN_PASSWORD:?define ADMIN_PASSWORD en tu .env}
      # La web de este stack. Una sola variable para los dos usos: el origen que acepta CORS y la base de
      # los enlaces de los correos (invitaciones y «fijar contraseña»). Sin barra final. Sin definirla, los
      # enlaces llevaban a https://localhost:60805, la web de desarrollo.
      - FrontendBaseUrl=${FRONTEND_BASE_URL:-http://localhost:5001}
      - AllowedOrigins=${FRONTEND_BASE_URL:-http://localhost:5001}
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5001:80"
    environment:
      # Dónde está la API para el navegador de quien usa la web, no para este contenedor. La imagen escribe
      # appsettings.json con este valor al arrancar.
      - API_BASE_URL=${API_BASE_URL:-http://localhost:5000/}
    depends_on:
      - api

volumes:
  sqlserver_data:
