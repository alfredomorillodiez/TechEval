events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Solo es inmutable lo que lleva una huella de contenido en el nombre, como
        # dotnet.native.6sals8nuk0.js o icudt_CJK.tjcz0u77k5.dat: el contenido de ese nombre no
        # cambia nunca. De los ficheros que publica la web, nueve no la llevan (index.html,
        # appsettings.json, css/app.css, js/exam-*.js, y _framework/blazor.boot.json,
        # blazor.webassembly.js y dotnet.js). Marcarlos como inmutables dejaba a los usuarios con la
        # versión vieja durante un año tras cada actualización. Las comillas son necesarias por las
        # llaves del patrón. Un nombre con huella que ya no existe da 404 y no el index.html: no se
        # sirve HTML como si fuera un .wasm.
        location ~* "\.[a-z0-9]{10}\.(js|wasm|dat)$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Todo lo demás se revalida en cada carga: el navegador lo guarda, pregunta si cambió y
        # recibe un 304 barato. Incluye las rutas de la SPA, que se resuelven con index.html.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        gzip on;
        gzip_types text/plain text/css text/javascript application/javascript application/wasm application/json;
    }
}
