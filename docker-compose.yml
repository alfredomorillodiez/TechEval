version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SA_PASSWORD:?define SA_PASSWORD en tu .env — ver .env.example}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TechEvalDb;User Id=sa;Password=${SA_PASSWORD:?define SA_PASSWORD en tu .env};TrustServerCertificate=True;
      - Jwt__SecretKey=${JWT_SECRET_KEY:?define JWT_SECRET_KEY en tu .env — ver .env.example}
      - Email__Host=smtp.sendgrid.net
      - Email__Port=587
      - Email__UserName=apikey
      - Email__Password=${SENDGRID_API_KEY:?define SENDGRID_API_KEY en tu .env}
      - Email__FromEmail=${EMAIL_FROM:?define EMAIL_FROM en tu .env}
      - AdminPassword=${ADMIN_PASSWORD:?define ADMIN_PASSWORD en tu .env}
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5001:80"
    depends_on:
      - api

  # MailHog para desarrollo local (captura emails)
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    profiles:
      - dev

volumes:
  sqlserver_data:
